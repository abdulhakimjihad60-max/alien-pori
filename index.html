<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pori ❤️ Chat</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script>
tailwind.config = {
    theme: {
        extend: {
            fontFamily: {
                sans: ['Hind Siliguri', 'Inter', 'sans-serif']
            },
            animation: {
                messageIn: 'messageIn .35s cubic-bezier(.16,1,.3,1)',
                pop: 'pop .25s ease-out',
                glow: 'glow 2s infinite',
                typing: 'typing 1.4s infinite ease-in-out',
                pulseSoft: 'pulseSoft 2s infinite'
            },
            keyframes: {

                messageIn: {
                    '0%': {
                        opacity: '0',
                        transform: 'translateY(14px) scale(.96)'
                    },
                    '100%': {
                        opacity: '1',
                        transform: 'translateY(0) scale(1)'
                    }
                },

                pop: {
                    '0%': {
                        transform: 'scale(.8)',
                        opacity: '0'
                    },
                    '100%': {
                        transform: 'scale(1)',
                        opacity: '1'
                    }
                },

                glow: {
                    '0%,100%': {
                        boxShadow: '0 0 15px rgba(236,72,153,.35)'
                    },
                    '50%': {
                        boxShadow: '0 0 30px rgba(168,85,247,.7)'
                    }
                },

                typing: {
                    '0%,80%,100%': {
                        transform: 'scale(.45)',
                        opacity: '.45'
                    },
                    '40%': {
                        transform: 'scale(1)',
                        opacity: '1'
                    }
                },

                pulseSoft: {
                    '0%,100%': {
                        opacity: '.65'
                    },
                    '50%': {
                        opacity: '1'
                    }
                }
            }
        }
    }
};
</script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: 'Hind Siliguri', 'Inter', sans-serif;
    background:
        radial-gradient(circle at 10% 20%, rgba(236,72,153,.20), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(139,92,246,.20), transparent 30%),
        #05030a;
    color: white;
    overflow: hidden;
}

/* Scrollbar */

::-webkit-scrollbar {
    width: 5px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.16);
    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: rgba(236,72,153,.5);
}

/* Glass */

.glass {
    background: rgba(15,10,25,.70);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255,255,255,.10);
}

.glass-light {
    background: rgba(255,255,255,.055);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,.08);
}

/* Background blobs */

.blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    opacity: .30;
}

.blob-one {
    width: 280px;
    height: 280px;
    background: #ec4899;
    top: -80px;
    left: -80px;
}

.blob-two {
    width: 320px;
    height: 320px;
    background: #7c3aed;
    bottom: -120px;
    right: -100px;
}

/* Header */

.header-gradient {
    background:
        linear-gradient(
            135deg,
            rgba(236,72,153,.96),
            rgba(147,51,234,.96),
            rgba(79,70,229,.96)
        );
}

/* Message bubbles */

.sent-bubble {
    background:
        linear-gradient(
            135deg,
            #ec4899 0%,
            #d946ef 45%,
            #8b5cf6 100%
        );

    box-shadow:
        0 8px 25px rgba(236,72,153,.20),
        inset 0 1px 0 rgba(255,255,255,.18);
}

.received-bubble {
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.105),
            rgba(255,255,255,.045)
        );

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,.09);

    box-shadow:
        0 8px 25px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.06);
}

/* Online pulse */

.online-ring {
    animation: glow 2s infinite;
}

/* Input */

.chat-input {
    background: rgba(255,255,255,.075);
    border: 1px solid rgba(255,255,255,.09);
    transition: .25s;
}

.chat-input:focus {
    background: rgba(255,255,255,.10);
    border-color: rgba(236,72,153,.55);
    box-shadow: 0 0 0 3px rgba(236,72,153,.08);
}

/* Send button */

.send-button {
    background:
        linear-gradient(
            135deg,
            #ec4899,
            #d946ef,
            #7c3aed
        );

    box-shadow:
        0 8px 25px rgba(236,72,153,.30);
}

/* typing */

.typing-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #f472b6;
    display: block;
    animation: typing 1.4s infinite ease-in-out;
}

.typing-dot:nth-child(2) {
    animation-delay: .18s;
}

.typing-dot:nth-child(3) {
    animation-delay: .36s;
}

/* message animation */

.message-animation {
    animation: messageIn .35s cubic-bezier(.16,1,.3,1);
}

/* Hide */

.hidden {
    display: none !important;
}

</style>
</head>

<script>

/* =========================
   DEFAULT MESSAGES
========================= */

const defaultMessages = [

    {
        id: 1,
        sender: "user",
        text: "Valo lagche na emnie 🥺",
        time: "১১:৪১ AM",
        status: "seen"
    },

    {

    {
        id: 4,

    },

    {
        id: 5,
        sender: "user",
        text: "Ki korcho?",
        time: "১১:৪৩ AM",
        status: "seen"
    },

    {
        id: 6,
        sender: "user",
        text: "Ghum theke 10 tay uthci",
        time: "১১:৪৫ AM",
        status: "seen"
    },

    {
        id: 7,
        sender: "pori",
        text: "Hi",
        time: "০৪:১৭ PM"
    },

    {
        id: 8,
        sender: "pori",
        text: "Hi",
        time: "০৪:১৮ PM"
    },

    {
        id: 9,
        sender: "pori",
        text: "Hf",
        time: "০৪:১৮ PM"
    },

    {
        id: 10,
        sender: "pori",
        text: "Hi",
        time: "০৫:২২ PM"
    },

    {
        id: 11,
        sender: "user",
        text: "??",
        time: "০৫:৩৪ PM",
        status: "sent"
    }

];


let messages = [...defaultMessages];

let isOnline = true;

let lastSeen = "০৩:১৫ PM";


/* =========================
   AUTO REPLIES
========================= */

const replies = [

    "Ki hoise bolba to? 🥺",

    "Hm bolo, suntsi... ❤️",

    "Kothay gele bolo? 🙈",

    "Mon kharap keno tomar?",

    "Accha shono, ektu busy achi ekhon ❤️",

    "Khae neso kokhn?",

    "Ami achi to, bolo... 🥺",

    "Hmm bujhte parchi ❤️",

    "Ektu por call dio, okey? 😘"

];


/* =========================
   PAGE LOAD
========================= */

window.addEventListener("load", () => {

    renderMessages();

    updateStatus();

    updateSendButton();

});


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages() {

    const container =
        document.getElementById("chatContainer");

    container.innerHTML = "";


    messages.forEach((msg, index) => {

        const isUser =
            msg.sender === "user";

        const previous =
            messages[index - 1];

        const next =
            messages[index + 1];


        const sameAsPrevious =
            previous &&
            previous.sender === msg.sender;


        const sameAsNext =
            next &&
            next.sender === msg.sender;


        const wrapper =
            document.createElement("div");

        wrapper.className =
            `flex ${
                isUser
                    ? "justify-end"
                    : "justify-start"
            } message-animation`;


        /* =========================
           MESSAGE ROW
        ========================= */

        const row =
            document.createElement("div");

        row.className =
            `flex items-end gap-2 max-w-[86%] ${
                isUser
                    ? "flex-row-reverse"
                    : ""
            }`;


        /* Avatar only for first message
           in a message group */

        let avatarHTML = "";

        if (!isUser && !sameAsPrevious) {

            avatarHTML = `

                <img
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80"
                class="w-7 h-7 rounded-full object-cover border border-white/10 mb-1 shrink-0">

            `;

        } else if (!isUser) {

            avatarHTML = `
                <div class="w-7 h-7 shrink-0"></div>
            `;

        }


        /* Bubble radius */

        let radius = "rounded-2xl";

        if (isUser) {

            if (sameAsPrevious && sameAsNext) {

                radius =
                    "rounded-2xl rounded-r-md";

            } else if (sameAsPrevious) {

                radius =
                    "rounded-2xl rounded-tr-md";

            } else if (sameAsNext) {

                radius =
                    "rounded-2xl rounded-br-md";

            }

        } else {

            if (sameAsPrevious && sameAsNext) {

                radius =
                    "rounded-2xl rounded-l-md";

            } else if (sameAsPrevious) {

                radius =
                    "rounded-2xl rounded-tl-md";

            } else if (sameAsNext) {

                radius =
                    "rounded-2xl rounded-bl-md";

            }

        }


        let content = "";


        /* IMAGE */

        if (msg.type === "image") {

            content = `

                <img
                src="${msg.mediaUrl}"
                class="rounded-xl max-w-[220px] max-h-[260px] object-cover border border-white/10"
                alt="Image">

            `;

        }


        /* AUDIO */

        else if (msg.type === "audio") {

            content = `

                <div class="flex items-center gap-3 min-w-[190px]">

                    <button
                    onclick="playVoice(this)"
                    class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center hover:bg-white/30 active:scale-90 transition">

                        <i class="fa-solid fa-play text-xs"></i>

                    </button>

                    <div class="flex-1">

                        <div class="h-1.5 bg-white/20 rounded-full overflow-hidden">

                            <div
                            class="h-full w-[42%] bg-white rounded-full">
                            </div>

                        </div>

                    </div>

                    <span class="text-[10px] opacity-70">
                        0:04
                    </span>

                </div>

            `;

        }


        /* TEXT */

        else {

            content = `

                <p class="text-[14px] leading-relaxed break-words">
                    ${escapeHTML(msg.text)}
                </p>

            `;

        }


        /* Status */

        let statusHTML = "";

        if (isUser) {

            let icon = "fa-check";

            let statusText = "Sent";

            if (msg.status === "delivered") {

                icon = "fa-check-double";
                statusText = "Delivered";

            }

            if (msg.status === "seen") {

                icon = "fa-check-double";
                statusText = "Seen";

            }


            statusHTML = `

                <span class="text-[9px] ${
                    msg.status === "seen"
                        ? "text-pink-200"
                        : "text-white/55"
                } flex items-center gap-1">

                    <i class="fa-solid ${icon}"></i>

                    ${statusText}

                </span>

            `;

        }


        /* Time only at end of group */

        let timeHTML = "";

        if (!sameAsNext) {

            timeHTML = `

                <div class="flex justify-end items-center gap-1 mt-1 opacity-70">

                    <span class="text-[9px]">
                        ${msg.time}
                    </span>

                    ${statusHTML}

                </div>

            `;

        }


        row.innerHTML = `

            ${avatarHTML}

            <div
            class="${
                isUser
                    ? "sent-bubble"
                    : "received-bubble"
            } ${radius} px-3.5 py-2.5 shadow-lg">

                ${content}

                ${timeHTML}

            </div>

        `;


        wrapper.appendChild(row);

        container.appendChild(wrapper);

    });


    scrollBottom();

}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage() {

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if (!text) return;


    messages.push({

        id: Date.now(),

        sender: "user",

        text: text,

        time: formatTime(),

        status: "sent"

    });


    input.value = "";

    updateSendButton();

    closeEmoji();

    renderMessages();

    simulateReply();

}


/* =========================
   PORI REPLY
========================= */

function simulateReply() {

    /* delivered */

    setTimeout(() => {

        messages.forEach(msg => {

            if (
                msg.sender === "user" &&
                msg.status === "sent"
            ) {

                msg.status = "delivered";

            }

        });

        isOnline = true;

        updateStatus();

        renderMessages();

    }, 700);


    /* typing */

    setTimeout(() => {

        document
        .getElementById("typingIndicator")
        .classList.remove("hidden");

        scrollBottom();

    }, 1400);


    /* reply */

    setTimeout(() => {

        document
        .getElementById("typingIndicator")
        .classList.add("hidden");


        messages.forEach(msg => {

            if (msg.sender === "user") {

                msg.status = "seen";

            }

        });


        const reply =
            replies[
                Math.floor(
                    Math.random() * replies.length
                )
            ];


        messages.push({

            id: Date.now(),

            sender: "pori",

            text: reply,

            time: formatTime()

        });


        renderMessages();

        isOnline = true;

        updateStatus();


        /* Go offline after some time */

        setTimeout(() => {

            isOnline = false;

            lastSeen = formatTime();

            updateStatus();

        }, 7000);


    }, 3500);

}


/* =========================
   VOICE MESSAGE
========================= */

function sendVoice() {

    messages.push({

        id: Date.now(),

        sender: "user",

        type: "audio",

        time: formatTime(),

        status: "sent"

    });


    renderMessages();

    simulateReply();

}


function playVoice(button) {

    const icon =
        button.querySelector("i");

    icon.className =
        "fa-solid fa-pause text-xs";


    setTimeout(() => {

        icon.className =
            "fa-solid fa-play text-xs";

    }, 2000);

}


/* =========================
   FILE
========================= */

function triggerFileUpload() {

    document
        .getElementById("fileInput")
        .click();

}


function handleFile(event) {

    const file =
        event.target.files[0];

    if (!file) return;


    if (!file.type.startsWith("image/")) {

        alert("শুধু Image file পাঠাতে পারবে।");

        return;

    }


    const reader =
        new FileReader();


    reader.onload = function(e) {

        messages.push({

            id: Date.now(),

            sender: "user",

            type: "image",

            mediaUrl: e.target.result,

            time: formatTime(),

            status: "sent"

        });


        renderMessages();

        simulateReply();

    };


    reader.readAsDataURL(file);

}


/* =========================
   EMOJI
========================= */

function toggleEmoji() {

    document
        .getElementById("emojiPicker")

}


function closeEmoji() {

    document
        .getElementById("emojiPicker")
        .classList.add("hidden");

}


function addEmoji(emoji) {

    const input =
        document.getElementById("messageInput");

    input.value += emoji;

    updateSendButton();

}


/* =========================
   INPUT
========================= */

function updateSendButton() {

    const input =
        document.getElementById("messageInput");

    const send =
        document.getElementById("sendBtn");

    const voice =
        document.getElementById("voiceBtn");


    if (input.value.trim()) {

        send.classList.remove("hidden");

        voice.classList.add("hidden");

    } else {

        send.classList.add("hidden");

        voice.classList.remove("hidden");

    }

}


function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   STATUS
========================= */

function updateStatus() {

    const dot =
        document.getElementById("statusDot");

    const text =
        document.getElementById("statusText");


    const profileStatus =
        document.getElementById("profileStatus");


    if (isOnline) {

        dot.className =
            "absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-purple-900 bg-emerald-400";


        text.innerHTML = `

            <span class="w-1.5 h-1.5 rounded-full bg-emerald-300"></span>

            <span>Online</span>

        `;


        if (profileStatus) {

            profileStatus.innerText =
                "Online";

            profileStatus.className =
                "text-sm text-emerald-300 mt-1";

        }

    } else {

        dot.className =
            "absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full border-2 border-purple-900 bg-slate-500";


        text.innerHTML = `

            <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>

            <span>Offline • ${lastSeen}</span>

        `;


        if (profileStatus) {

            profileStatus.innerText =
                `Offline • ${lastSeen}`;

            profileStatus.className =
                "text-sm text-slate-400 mt-1";

        }

    }

}

/* =========================
   TIME
========================= */

function formatTime() {

    const date = new Date();

    let hours =
        date.getHours();

    let minutes =
        date.getMinutes();

    const ampm =
        hours >= 12
            ? "PM"
            : "AM";


    hours =
        hours % 12 || 12;


    minutes =
        minutes < 10
            ? "0" + minutes
            : minutes;


    const time =
        `${hours}:${minutes} ${ampm}`;


    return bengaliNumbers(time);

}


/* =========================
   BENGALI NUMBERS
========================= */

function bengaliNumbers(str) {

    const numbers = {

        "0":"০",
        "1":"১",
        "2":"২",
        "3":"৩",
        "4":"৪",
        "5":"৫",
        "6":"৬",
        "7":"৭",
        "8":"৮",
        "9":"৯"

    };


    return str.replace(
        /[0-9]/g,
        number => numbers[number]
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    return text

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================
   SCROLL
========================= */

function scrollBottom() {

    const container =
        document.getElementById("chatContainer");

    setTimeout(() => {

        container.scrollTo({

            top: container.scrollHeight,

            behavior: "smooth"

        });

    }, 50);

}
