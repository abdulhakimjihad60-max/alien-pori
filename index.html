<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pori - Chat App</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at top left,#6d245f 0%,transparent 40%),
        radial-gradient(circle at bottom right,#39206c 0%,transparent 45%),
        #130b1d;
    color:white;
}

/* APP */

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(18px);
    overflow:hidden;
}

/* HEADER */

.header{
    height:72px;
    flex-shrink:0;

    display:flex;
    align-items:center;

    padding:9px 14px;

    background:rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.12);
}

/* PROFILE */

.profile{
    width:52px;
    height:52px;

    position:relative;

    margin-right:12px;

    cursor:pointer;
}

.profile img{
    width:52px;
    height:52px;

    border-radius:50%;

    object-fit:cover;

    border:2px solid rgba(255,255,255,.75);

    background:#33213b;
}

/* ONLINE */

.online-dot{
    width:13px;
    height:13px;

    position:absolute;

    right:0;
    bottom:1px;

    background:#20e66a;

    border:2px solid #211126;

    border-radius:50%;
}

/* PROFILE INFO */

.info h2{
    font-size:18px;
    font-weight:600;
}

.status{
    margin-top:3px;
    font-size:12px;
    color:#a9ffc4;
}

/* CHAT */

.chat{
    flex:1;

    overflow-y:auto;

    padding:15px 13px 12px;

    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:3px;
}

.chat::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.2);
    border-radius:10px;
}

/* MESSAGE */

.message{
    max-width:78%;

    padding:9px 12px;

    margin-bottom:7px;

    border-radius:18px;

    font-size:15px;

    line-height:1.4;

    word-break:break-word;

    animation:messageIn .15s ease-out;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(4px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* PORI */

.message.pori{
    margin-right:auto;

    background:rgba(255,255,255,.12);

    border-bottom-left-radius:5px;
}

/* MY MESSAGE */

.message.me{
    margin-left:auto;

    background:linear-gradient(
        135deg,
        #ff3f9f,
        #984cff
    );

    border-bottom-right-radius:5px;
}

/* TIME */

.time{
    margin-top:3px;

    font-size:9px;

    text-align:right;

    opacity:.65;
}

.seen{
    margin-left:4px;
}

/* IMAGE MESSAGE */

.message img.sent-image{
    display:block;

    max-width:220px;
    max-height:280px;

    border-radius:13px;

    object-fit:cover;
}

/* INPUT AREA */

.input-area{
    width:100%;

    display:flex;
    align-items:center;

    gap:7px;

    padding:9px;

    background:rgba(255,255,255,.08);

    border-top:1px solid rgba(255,255,255,.1);
}

/* ICON BUTTON */

.icon-btn{
    width:40px;
    height:40px;

    flex-shrink:0;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.11);

    color:white;

    font-size:18px;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.15s;
}

.icon-btn:active{
    transform:scale(.9);
}

/* INPUT */

.input{
    flex:1;

    min-width:0;

    height:42px;

    border:none;
    outline:none;

    border-radius:22px;

    padding:0 15px;

    background:rgba(255,255,255,.11);

    color:white;

    font-size:15px;
}

.input::placeholder{
    color:#aaa;
}

/* SEND */

.send{
    width:42px;
    height:42px;

    flex-shrink:0;

    border:none;
    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ff3f9f,
            #984cff
        );

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.12s;
}

.send:active{
    transform:scale(.88);
}

/* HIDDEN FILE INPUT */

.hidden-file{
    display:none;
}

/* PROFILE MENU */

.overlay{
    position:fixed;

    inset:0;

    display:none;

    background:rgba(0,0,0,.55);

    z-index:50;
}

.profile-menu{
    width:290px;

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    padding:20px;

    display:none;

    z-index:60;

    text-align:center;

    border-radius:22px;

    background:
        rgba(37,19,48,.97);

    border:1px solid rgba(255,255,255,.14);

    box-shadow:
        0 20px 70px rgba(0,0,0,.55);
}

.profile-menu h3{
    margin-bottom:13px;
    font-size:18px;
}

.profile-menu button{
    width:100%;

    padding:12px;

    margin-top:8px;

    border:none;

    border-radius:12px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff3f9f,
            #984cff
        );

    font-size:14px;

    cursor:pointer;
}

.profile-menu .cancel{
    background:rgba(255,255,255,.1);
}

/* NO AUTO TYPING */

.typing{
    display:none;
}

</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div
            class="profile"
            onclick="openProfileMenu()"
        >

            <img
                id="profilePic"
                src="https://i.imgur.com/8Km9tLL.png"
                alt="Pori"
            >

            <div class="online-dot"></div>

        </div>


        <div class="info">

            <h2>Pori</h2>

            <div
                class="status"
                id="status"
            >
                Online
            </div>

        </div>

    </div>


    <!-- CHAT -->

    <div
        class="chat"
        id="chat"
    >

        <div class="message pori">

            Hii ❤️

            <div class="time">
                Now
            </div>

        </div>


        <div class="message pori">

            Ki korcho? 🥺

            <div class="time">
                Now
            </div>

        </div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <!-- FILE -->

        <button
            class="icon-btn"
            onclick="openFilePicker()"
            type="button"
        >
            📎
        </button>

        <input
            type="file"
            id="fileInput"
            class="hidden-file"
            accept="image/*,video/*"
            onchange="handleFile(event)"
        >


        <!-- TEXT -->

        <input
            id="messageInput"
            class="input"
            type="text"
            placeholder="Message..."
            autocomplete="off"
        >


        <!-- VOICE -->

        <button
            class="icon-btn"
            onclick="sendVoice()"
            type="button"
        >
            🎤
        </button>


        <!-- SEND -->

        <button
            class="send"
            onclick="sendMessage()"
            type="button"
        >
            ➤
        </button>

    </div>

</div>


<!-- OVERLAY -->

<div
    class="overlay"
    id="overlay"
    onclick="closeProfileMenu()"
></div>


<!-- PROFILE MENU -->

<div
    class="profile-menu"
    id="profileMenu"
>

    <h3>
        Pori Profile
    </h3>


    <button
        onclick="chooseProfilePicture()"
    >
        📷 Change Profile Picture
    </button>


    <button
        onclick="removeProfilePicture()"
    >
        🗑️ Remove Picture
    </button>


    <button
        class="cancel"
        onclick="closeProfileMenu()"
    >
        Cancel
    </button>

</div>


<!-- PROFILE FILE -->

<input
    type="file"
    id="profileInput"
    class="hidden-file"
    accept="image/*"
    onchange="changeProfilePicture(event)"
>


<script>

/* =========================================
   PROFILE PICTURE
========================================= */

const profilePic =
document.getElementById("profilePic");

const defaultProfile =
"https://i.imgur.com/8Km9tLL.png";


/* LOAD SAVED PROFILE */

const savedProfile =
localStorage.getItem("poriProfilePicture");

if(savedProfile){

    profilePic.src =
    savedProfile;

}


/* OPEN MENU */

function openProfileMenu(){

    document.getElementById(
        "profileMenu"
    ).style.display = "block";

    document.getElementById(
        "overlay"
    ).style.display = "block";

}


/* CLOSE MENU */

function closeProfileMenu(){

    document.getElementById(
        "profileMenu"
    ).style.display = "none";

    document.getElementById(
        "overlay"
    ).style.display = "none";

}


/* SELECT PROFILE */

function chooseProfilePicture(){

    document.getElementById(
        "profileInput"
    ).click();

}


/* CHANGE PROFILE */

function changeProfilePicture(event){

    const file =
    event.target.files[0];

    if(!file){
        return;
    }


    if(!file.type.startsWith("image/")){

        alert(
            "Please select an image."
        );

        return;
    }


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        const image =
        e.target.result;

        profilePic.src =
        image;


        localStorage.setItem(
            "poriProfilePicture",
            image
        );


        closeProfileMenu();

    };


    reader.readAsDataURL(file);

}


/* REMOVE PROFILE */

function removeProfilePicture(){

    localStorage.removeItem(
        "poriProfilePicture"
    );

    profilePic.src =
    defaultProfile;

    closeProfileMenu();

}


/* =========================================
   CHAT
========================================= */

const input =
document.getElementById(
    "messageInput"
);

const chat =
document.getElementById(
    "chat"
);


/* TIME */

function getTime(){

    const now =
    new Date();

    return now.toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* SCROLL */

function scrollChat(){

    requestAnimationFrame(() => {

        chat.scrollTop =
        chat.scrollHeight;

    });

}


/* =========================================
   SEND TEXT
========================================= */

function sendMessage(){

    const text =
    input.value.trim();


    if(!text){
        return;
    }


    const message =
    document.createElement(
        "div"
    );


    message.className =
    "message me";


    message.innerHTML = `
        ${escapeHTML(text)}

        <div class="time">
            ${getTime()}
            <span class="seen">✓✓</span>
        </div>
    `;


    chat.appendChild(
        message
    );


    /* CLEAR INPUT IMMEDIATELY */

    input.value = "";


    /* KEEP FOCUS */

    input.focus();


    /* INSTANT SCROLL */

    scrollChat();

}


/* =========================================
   ENTER SEND
========================================= */

input.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   FILE PICKER
========================================= */

function openFilePicker(){

    document.getElementById(
        "fileInput"
    ).click();

}


/* =========================================
   SEND FILE / IMAGE
========================================= */

function handleFile(event){

    const file =
    event.target.files[0];


    if(!file){
        return;
    }


    const reader =
    new FileReader();


    reader.onload =
    function(e){

        const message =
        document.createElement(
            "div"
        );


        message.className =
        "message me";


        if(
            file.type.startsWith(
                "image/"
            )
        ){

            message.innerHTML = `

                <img
                    class="sent-image"
                    src="${e.target.result}"
                    alt="Image"
                >

                <div class="time">
                    ${getTime()}
                    <span class="seen">✓✓</span>
                </div>

            `;

        }

        else{

            message.innerHTML = `

                📎 ${escapeHTML(file.name)}

                <div class="time">
                    ${getTime()}
                    <span class="seen">✓✓</span>
                </div>

            `;

        }


        chat.appendChild(
            message
        );


        scrollChat();

    };


    reader.readAsDataURL(file);


    /* RESET */

    event.target.value = "";

}


/* =========================================
   VOICE
========================================= */

function sendVoice(){

    const message =
    document.createElement(
        "div"
    );


    message.className =
    "message me";


    message.innerHTML = `

        🎤 Voice message

        <div class="time">
            ${getTime()}
            <span class="seen">✓✓</span>
        </div>

    `;


    chat.appendChild(
        message
    );


    scrollChat();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text){

    const div =
    document.createElement(
        "div"
    );


    div.textContent =
    text;


    return div.innerHTML;

}


/* =========================================
   INITIAL SCROLL
========================================= */

window.addEventListener(
    "load",
    function(){

        chat.scrollTop =
        chat.scrollHeight;

    }
);

</script>

</body>
</html>
