<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pori - Chat App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at top left,#6d245f 0%,transparent 40%),
        radial-gradient(circle at bottom right,#39206c 0%,transparent 45%),
        #130b1d;
    color:white;
}

.app{
    width:100%;
    max-width:500px;
    height:100dvh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(18px);
    overflow:hidden;
}

/* HEADER */

.header{
    height:72px;
    min-height:72px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    padding:9px 14px;

    background:rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.12);
}

.logo{
    width:50px;
    height:50px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-right:12px;
    border-radius:50%;

    background:linear-gradient(135deg,#ff3f9f,#984cff);

    font-size:21px;
    font-weight:bold;

    box-shadow:0 5px 20px rgba(255,63,159,.25);
}

.info{
    flex:1;
}

.info h2{
    font-size:18px;
    font-weight:600;
}

.status{
    margin-top:3px;
    font-size:12px;
    color:#a9ffc4;
}

/* CALL BUTTONS */

.call-buttons{
    display:flex;
    gap:7px;
}

.call-btn{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.11);
    color:white;
    font-size:17px;
    cursor:pointer;
}

.call-btn:active{
    transform:scale(.88);
}

/* CHAT */

.chat{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:15px 13px 12px;
    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:3px;
}

.chat::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.2);
    border-radius:10px;
}

/* MESSAGE */

.message{
    max-width:78%;
    padding:9px 12px;
    margin-bottom:7px;
    border-radius:18px;
    font-size:15px;
    line-height:1.4;
    word-break:break-word;
    animation:messageIn .15s ease-out;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(4px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

    margin
