<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pori - Chat App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at top left,#6d245f 0%,transparent 40%),
        radial-gradient(circle at bottom right,#39206c 0%,transparent 45%),
        #130b1d;
    color:white;
}

.app{
    width:100%;
    max-width:500px;
    height:100dvh;
    margin:0 auto;

    display:flex;
    flex-direction:column;

    background:rgba(255,255,255,.05);
    backdrop-filter:blur(18px);

    overflow:hidden;
}

/* HEADER */

.header{
    height:72px;
    min-height:72px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    padding:9px 14px;

    background:rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.12);
}

.logo{
    width:50px;
    height:50px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-right:12px;
    border-radius:50%;

    background:linear-gradient(135deg,#ff3f9f,#984cff);

    font-size:21px;
    font-weight:bold;

    box-shadow:0 5px 20px rgba(255,63,159,.25);
}

.info h2{
    font-size:18px;
    font-weight:600;
}

.status{
    margin-top:3px;
    font-size:12px;
    color:#a9ffc4;
}

/* CHAT */

.chat{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:15px 13px 12px;

    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:3px;
}

.chat::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.2);
    border-radius:10px;
}

/* MESSAGE */

.message{
    max-width:78%;

    padding:9px 12px;
    margin-bottom:7px;

    border-radius:18px;

    font-size:15px;
    line-height:1.4;

    word-break:break-word;

    animation:messageIn .15s ease-out;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(4px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.pori{
    margin-right:auto;
    background:rgba(255,255,255,.12);
    border-bottom-left-radius:5px;
}

.message.me{
    margin-left:auto;

    background:linear-gradient(135deg,#ff3f9f,#984cff);

    border-bottom-right-radius:5px;
}

.time{
    margin-top:3px;
    font-size:9px;
    text-align:right;
    opacity:.65;
}

.seen{
    margin-left:4px;
}

/* INPUT */

.input-area{
    width:100%;
    min-height:60px;
    flex-shrink:0;

    display:flex;
    align-items:center;

    gap:8px;
    padding:9px;

    background:rgba(255,255,255,.08);

    border-top:1px solid rgba(255,255,255,.1);
}

.input{
    flex:1;
    min-width:0;

    height:42px;

    border:none;
    outline:none;

    border-radius:22px;

    padding:0 15px;

    background:rgba(255,255,255,.11);

    color:white;

    font-size:15px;
}

.input::placeholder{
    color:#aaa;
}

.send{
    width:42px;
    height:42px;
    flex-shrink:0;

    border:none;
    border-radius:50%;

    background:linear-gradient(135deg,#ff3f9f,#984cff);

    color:white;

    font-size:18px;

    cursor:pointer;
}

.send:active{
    transform:scale(.88);
}

/* LOGIN */

.login-box{
    position:fixed;
    inset:0;
    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at top left,
            #6d245f,
            #130b1d 60%
        );
}

.login-card{
    width:100%;
    max-width:360px;

    padding:25px;

    border-radius:24px;

    background:rgba(255,255,255,.09);

    border:1px solid rgba(255,255,255,.14);

    backdrop-filter:blur(20px);

    text-align:center;
}

.login-card h2{
    margin-bottom:8px;
}

.login-card p{
    font-size:12px;
    color:#bbb;
    margin-bottom:18px;
}

.login-input{
    width:100%;
    height:45px;

    margin-top:9px;

    padding:0 14px;

    border:none;
    outline:none;

    border-radius:13px;

    color:white;

    background:rgba(255,255,255,.1);
}

.login-input::placeholder{
    color:#aaa;
}

.login-button{
    width:100%;
    height:45px;

    margin-top:12px;

    border:none;
    border-radius:13px;

    color:white;

    font-size:15px;

    background:linear-gradient(135deg,#ff3f9f,#984cff);

    cursor:pointer;
}

.login-error{
    margin-top:10px;
    font-size:12px;
    color:#ff9fbd;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-box" id="loginBox">

    <div class="login-card">

        <h2>💜 Pori Chat</h2>

        <p>Login to continue</p>

        <input
            class="login-input"
            id="emailInput"
            type="email"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            class="login-input"
            id="passwordInput"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            class="login-button"
            onclick="loginUser()"
            type="button"
        >
            Login
        </button>

        <div
            class="login-error"
            id="loginError"
        ></div>

    </div>

</div>

<!-- APP -->

<div class="app">

    <div class="header">

        <div class="logo">P</div>

        <div class="info">

            <h2>Pori</h2>

            <div class="status" id="status">
                Connecting...
            </div>

        </div>

    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">

        <input
            id="messageInput"
            class="input"
            type="text"
            placeholder="Message..."
            autocomplete="off"
        >

        <button
            class="send"
            onclick="sendMessage()"
            type="button"
        >
            ➤
        </button>

    </div>

</div>

<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyB6DFVQNrPmKtshg978khg7GAKCrS69ANU",

    authDomain:
    "alien-pori---chat.firebaseapp.com",

    projectId:
    "alien-pori---chat",

    storageBucket:
    "alien-pori---chat.firebasestorage.app",

    messagingSenderId:
    "141609051933",

    appId:
    "1:141609051933:web:7abdb1828986b5a29ee3f4",

    measurementId:
    "G-KC5NKQ57H6"
};


/* START FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* CHAT ROOM */

const messagesRef = collection(
    db,
    "chats",
    "alien-pori-chat",
    "messages"
);


/* ELEMENTS */

const input =
document.getElementById("messageInput");

const chat =
document.getElementById("chat");

const status =
document.getElementById("status");

const loginBox =
document.getElementById("loginBox");

const loginError =
document.getElementById("loginError");


/* USER */

let currentUser = null;

let unsubscribeMessages = null;


/* AUTH */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            currentUser = user;

            loginBox.style.display = "none";

            status.textContent = "Online";

            loadMessages();

        }else{

            currentUser = null;

            loginBox.style.display = "flex";

            status.textContent = "Login required";

            chat.innerHTML = "";

        }

    }
);


/* LOGIN */

window.loginUser = async function(){

    const email =
    document.getElementById("emailInput")
    .value
    .trim();

    const password =
    document.getElementById("passwordInput")
    .value;

    loginError.textContent = "";

    if(!email || !password){

        loginError.textContent =
        "Email and password দিন।";

        return;
    }

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(error);

        loginError.textContent =
        "Login failed.";

    }

};


/* LOAD CHAT */

function loadMessages(){

    if(unsubscribeMessages){

        unsubscribeMessages();

    }

    const q = query(
        messagesRef,
        orderBy("createdAt","asc")
    );

    unsubscribeMessages =
    onSnapshot(
        q,

        function(snapshot){

            chat.innerHTML = "";

            snapshot.forEach(
                function(doc){

                    showMessage(doc.data());

                }
            );

            scrollChat();

        },

        function(error){

            console.error(
                "Firestore error:",
                error
            );

            status.textContent =
            "Chat connection error";

        }
    );

}


/* SHOW MESSAGE */

function showMessage(data){

    const message =
    document.createElement("div");

    const mine =
    currentUser &&
    data.uid === currentUser.uid;

    message.className =
    mine
    ? "message me"
    : "message pori";

    let time = "Now";

    if(data.createdAt){

        try{

            time =
            data.createdAt
            .toDate()
            .toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

        }catch(error){}

    }

    message.innerHTML = `

        ${escapeHTML(data.text || "")}

        <div class="time">

            ${time}

            ${
                mine
                ? '<span class="seen">✓✓</span>'
                : ''
            }

        </div>

    `;

    chat.appendChild(message);

}


/* SEND MESSAGE */

window.sendMessage = async function(){

    const text =
    input.value.trim();

    if(!text){

        return;

    }

    if(!currentUser){

        alert("আগে login করো।");

        return;

    }

    input.value = "";

    input.focus();

    try{

        await addDoc(
            messagesRef,
            {

                text:text,

                uid:currentUser.uid,

                email:currentUser.email || "",

                createdAt:serverTimestamp()

            }
        );

    }catch(error){

        console.error(error);

        alert("Message send হয়নি।");

    }

};


/* ENTER SEND */

input.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            window.sendMessage();

        }

    }
);


/* SCROLL */

function scrollChat(){

    requestAnimationFrame(
        function(){

            chat.scrollTop =
            chat.scrollHeight;

        }
    );

}


/* SECURITY */

function escapeHTML(text){

    const div =
    document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
