<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pori - Chat App</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:linear-gradient(135deg,#160b22,#32143f,#1b1028);
  min-height:100vh;
  color:white;
}

.app{
  width:100%;
  max-width:480px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(20px);
  overflow:hidden;
}

/* HEADER */
.header{
  height:75px;
  display:flex;
  align-items:center;
  padding:10px 15px;
  background:rgba(255,255,255,.09);
  border-bottom:1px solid rgba(255,255,255,.12);
}

.profile{
  position:relative;
  width:52px;
  height:52px;
  margin-right:12px;
  cursor:pointer;
}

.profile img{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid rgba(255,255,255,.7);
}

.online-dot{
  position:absolute;
  width:13px;
  height:13px;
  background:#25e56b;
  border:2px solid #24102e;
  border-radius:50%;
  right:0;
  bottom:1px;
}

.info h2{
  font-size:18px;
}

.status{
  font-size:12px;
  color:#b8ffca;
  margin-top:4px;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:18px 14px 15px;
  scroll-behavior:smooth;
}

.message{
  max-width:78%;
  padding:10px 13px;
  margin-bottom:8px;
  border-radius:18px;
  font-size:15px;
  line-height:1.4;
  word-wrap:break-word;
  animation:messageIn .25s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(10px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.message.pori{
  background:rgba(255,255,255,.13);
  border-bottom-left-radius:5px;
  margin-right:auto;
}

.message.me{
  background:linear-gradient(135deg,#ff4fa3,#9c4dff);
  border-bottom-right-radius:5px;
  margin-left:auto;
}

.time{
  font-size:10px;
  opacity:.65;
  margin-top:4px;
  text-align:right;
}

.seen{
  font-size:10px;
  opacity:.7;
  margin-left:5px;
}

/* TYPING */
.typing{
  display:none;
  width:max-content;
  background:rgba(255,255,255,.12);
  padding:8px 12px;
  border-radius:15px;
  margin-bottom:10px;
  font-size:12px;
  color:#ddd;
}

.dots span{
  animation:blink 1.2s infinite;
}

.dots span:nth-child(2){
  animation-delay:.2s;
}

.dots span:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

/* INPUT AREA */
.input-area{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:rgba(255,255,255,.08);
  border-top:1px solid rgba(255,255,255,.1);
}

.icon-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  color:white;
  font-size:19px;
  cursor:pointer;
}

.input{
  flex:1;
  height:42px;
  border:none;
  outline:none;
  border-radius:22px;
  padding:0 16px;
  color:white;
  background:rgba(255,255,255,.12);
}

.input::placeholder{
  color:#bbb;
}

.send{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:linear-gradient(135deg,#ff4fa3,#9c4dff);
  color:white;
  font-size:18px;
  cursor:pointer;
}

input[type="file"]{
  display:none;
}

/* PROFILE MENU */
.profile-menu{
  position:fixed;
  display:none;
  z-index:20;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:290px;
  padding:20px;
  border-radius:22px;
  background:rgba(35,18,45,.96);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  text-align:center;
}

.profile-menu h3{
  margin-bottom:15px;
}

.profile-menu button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,#ff4fa3,#9c4dff);
  cursor:pointer;
}

.profile-menu .cancel{
  background:rgba(255,255,255,.1);
}

.overlay{
  position:fixed;
  inset:0;
  display:none;
  z-index:19;
  background:rgba(0,0,0,.5);
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">

    <div class="profile" onclick="openProfileMenu()">
      <img id="profilePic"
           src="https://i.imgur.com/8Km9tLL.png"
           alt="Pori">
      <div class="online-dot"></div>
    </div>

    <div class="info">
      <h2>Pori</h2>
      <div class="status" id="status">Online</div>
    </div>

  </div>

  <!-- CHAT -->
  <div class="chat" id="chat">

    <div class="message pori">
      Hii ❤️
      <div class="time">Now</div>
    </div>

    <div class="message pori">
      Ki korcho? 🥺
      <div class="time">Now</div>
    </div>

  </div>

  <!-- INPUT -->
  <div class="input-area">

    <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>

    <input
      type="file"
      id="fileInput"
      accept="image/*,video/*"
      onchange="handleFile(event)"
    >

    <input
      class="input"
      id="messageInput"
      type="text"
      placeholder="Message..."
      autocomplete="off"
    >

    <button class="icon-btn" onclick="sendVoice()">🎤</button>

    <button class="send" onclick="sendMessage()">➤</button>

  </div>

</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeProfileMenu()"></div>

<!-- PROFILE MENU -->
<div class="profile-menu" id="profileMenu">

  <h3>Profile Picture</h3>

  <button onclick="chooseProfilePicture()">
    📷 Change Profile Picture
  </button>

  <button onclick="removeProfilePicture()">
    🗑️ Remove Picture
  </button>

  <button class="cancel" onclick="closeProfileMenu()">
    Cancel
  </button>

</div>

<input
  type="file"
  id="profileInput"
  accept="image/*"
  style="display:none"
  onchange="changeProfilePicture(event)"
>

<script>

/* =========================
   PROFILE PICTURE
========================= */

const defaultProfile =
"https://i.imgur.com/8Km9tLL.png";

const profilePic =
document.getElementById("profilePic");

const savedProfile =
localStorage.getItem("poriProfilePicture");

if(savedProfile){
  profilePic.src = savedProfile;
}

function openProfileMenu(){
  document.getElementById("profileMenu").style.display = "block";
  document.getElementById("overlay").style.display = "block";
}

function closeProfileMenu(){
  document.getElementById("profileMenu").style.display = "none";
  document.getElementById("overlay").style.display = "none";
}

function chooseProfilePicture(){
  document.getElementById("profileInput").click();
}

function changeProfilePicture(event){

  const file = event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("Please select an image.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    profilePic.src = e.target.result;

    localStorage.setItem(
      "poriProfilePicture",
      e.target.result
    );

    closeProfileMenu();
  };

  reader.readAsDataURL(file);
}

function removeProfilePicture(){

  localStorage.removeItem("poriProfilePicture");

  profilePic.src = defaultProfile;

  closeProfileMenu();
}


/* =========================
   SEND MESSAGE
========================= */

const input =
document.getElementById("messageInput");

const chat =
document.getElementById("chat");

function getTime(){

  const now = new Date();

  return now.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });

}

function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  const message =
  document.createElement("div");

  message.className = "message me";

  message.innerHTML = `
    ${escapeHTML(text)}
    <div class="time">
      ${getTime()}
      <span class="seen">✓✓</span>
    </div>
  `;

  chat.appendChild(message);

  input.value = "";

  chat.scrollTop = chat.scrollHeight;

}


/* ENTER TO SEND */

input.addEventListener("keydown",function(e){

  if(e.key === "Enter"){
    e.preventDefault();
    sendMessage();
  }

});


/* =========================
   VOICE BUTTON
========================= */

function sendVoice(){

  const message =
  document.createElement("div");

  message.className = "message me";

  message.innerHTML = `
    🎤 Voice message
    <div class="time">
      ${getTime()}
      <span class="seen">✓✓</span>
    </div>
  `;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}


/* =========================
   FILE / IMAGE
========================= */

function handleFile(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    const message =
    document.createElement("div");

    message.className = "message me";

    if(file.type.startsWith("image/")){

      message.innerHTML = `
        <img
          src="${e.target.result}"
          style="
            max-width:220px;
            max-height:260px;
            border-radius:14px;
            display:block;
          "
        >
        <div class="time">
          ${getTime()}
          <span class="seen">✓✓</span>
        </div>
      `;

    }else{

      message.innerHTML = `
        📎 ${escapeHTML(file.name)}
        <div class="time">
          ${getTime()}
          <span class="seen">✓✓</span>
        </div>
      `;

    }

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

  };

  reader.readAsDataURL(file);

  event.target.value = "";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  const div =
  document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
